<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · SmartGreenAI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="login-page">
    <form class="login-card" id="login-form" novalidate>
      <div class="logo" aria-hidden="true">🌿</div>
      <h1>SmartGreenAI</h1>
      <p class="muted">Cilantro Crop · IoT precision agriculture and AI decision support</p>
      <div id="login-msg" role="alert"></div>
      <div class="field">
        <label for="email">Email or username</label>
        <input id="email" name="email" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="primary" type="submit" id="login-btn">Sign in</button>
      <p class="small muted" style="margin-top:1rem">Team 3 · UPAEP · Agile Project Management</p>
    </form>
  </div>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
